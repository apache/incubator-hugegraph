# 将 graph_a 的单个顶点标签复制到 graph_b；两个图需预先创建。
# PRIMARY_KEY 使用相同的 name 属性重建顶点 ID；该作业不会自动复制全图 schema 或边。
env {
  job.mode = "BATCH"
  parallelism = 1
}

source {
  HugeGraph {
    host = "hugegraph-server"
    port = 8080
    graph_space = "DEFAULT"
    graph_name = "graph_a"
    label = "seatunnel_demo_person"
    label_type = "VERTEX"
    username = ${HG_USERNAME}
    password = ${HG_PASSWORD}
    schema {
      fields {
        name = "string"
        age = "int"
      }
    }
  }
}

sink {
  HugeGraph {
    host = "hugegraph-server"
    port = 8080
    graph_space = "DEFAULT"
    graph_name = "graph_b"
    username = ${HG_USERNAME}
    password = ${HG_PASSWORD}
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    mappings = [
      {
        type = "VERTEX"
        label = "seatunnel_demo_person"
        idStrategy = "PRIMARY_KEY"
        idFields = ["name"]
        properties = ["name", "age"]
      }
    ]
  }
}
