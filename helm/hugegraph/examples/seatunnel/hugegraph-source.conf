# 读取 hugegraph-sink.conf 导入的标签；Console 输出到 worker 日志，单机模式为 master 日志。
env {
  job.mode = "BATCH"
  parallelism = 1
}

source {
  HugeGraph {
    host = "hugegraph-server"
    port = 8080
    graph_space = "DEFAULT"
    graph_name = "graph_a"
    label = "seatunnel_demo_person"
    label_type = "VERTEX"
    username = ${HG_USERNAME}
    password = ${HG_PASSWORD}
    schema {
      fields {
        name = "string"
        age = "int"
      }
    }
  }
}

sink {
  Console {}
}
